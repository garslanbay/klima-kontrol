<body>
<h2>Klima Uzaktan Kontrol</h2>
<div>
  <button id="btn-on" class="off" onclick="setPower(1)">AC</button>
  <button id="btn-off" class="on" onclick="setPower(0)">KAPAT</button>
</div>
<div style="margin-top:15px">
  <button class="temp" onclick="changeTemp(-1)">-</button>
  <span id="tempval">24</span>C
  <button class="temp" onclick="changeTemp(1)">+</button>
</div>
<h3>Fan Hizi</h3>
<div>
  <button class="fan" onclick="setFan(0, this)">Auto</button>
  <button class="fan" onclick="setFan(2, this)">Dusuk</button>
  <button class="fan" onclick="setFan(3, this)">Orta</button>
  <button class="fan" onclick="setFan(5, this)">Yuksek</button>
</div>
<h3>Salinim</h3>
<div>
  <button class="swing" onclick="setSwing(7, this)">Salinim Ac</button>
  <button class="swing" onclick="setSwing(0, this)">Salinim Kapa</button>
</div>

<div style="margin-top: 25px;">
  <button style="background:#27ae60; color:#fff; font-size:24px; padding:18px 30px; width:90%;" onclick="sendAllCommands()">TÜM KOMUTLARI GÖNDER</button>
</div>

<div id="status">Hazir</div>

<script>
const WRITE_API_KEY = "ODPBYH94R9T5MGN5"; // <-- BURAYA THINGSPEAK WRITE API KEY YAZIN

// Mevcut durum değişkenleri (ESP32'deki g_ac_state varsayılanları ile uyumlu)
let currentPower = 0;
let currentTemp = 24;
let currentFan = 0;
let currentSwing = 0;

function setPower(val) {
  currentPower = val;
  document.getElementById('btn-on').style.opacity = val ? "1" : "0.5";
  document.getElementById('btn-off').style.opacity = val ? "0.5" : "1";
  setStatus("Güç seçildi: " + (val ? "Açık" : "Kapalı"));
}

function changeTemp(delta) {
  currentTemp += delta;
  if (currentTemp < 16) currentTemp = 16;
  if (currentTemp > 31) currentTemp = 31;
  document.getElementById('tempval').innerText = currentTemp;
  setStatus("Sıcaklık seçildi: " + currentTemp + "°C");
}

function setFan(val, btn) {
  currentFan = val;
  setStatus("Fan hızı seçildi");
}

function setSwing(val, btn) {
  currentSwing = val;
  setStatus("Salınım seçildi");
}

function setStatus(msg) {
  document.getElementById('status').innerText = msg;
}

function sendAllCommands() {
  // Tek istekte field1(Power), field2(Temp), field3(Fan), field4(Swing) gönderiliyor
  const url = `https://api.thingspeak.com/update?api_key=${WRITE_API_KEY}&field1=${currentPower}&field2=${currentTemp}&field3=${currentFan}&field4=${currentSwing}`;
  
  setStatus('Tüm komutlar gönderiliyor...');
  fetch(url)
    .then(r => r.text())
    .then(t => {
      if (t === "0") {
        setStatus('HATA: ThingSpeak rate limit (15sn bekleyip tekrar deneyin)');
      } else {
        setStatus('Başarılı! Kayıt #' + t + ' (ESP32 20sn içinde uygulayacak)');
      }
    })
    .catch(e => setStatus('Bağlantı hatasi: ' + e));
}
</script>
</body>
